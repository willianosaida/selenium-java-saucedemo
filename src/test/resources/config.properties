# URL da aplicação usada nos testes
# Os valores podem ser substituidos no terminal: mvn test -Dbrowser=edge
base.url=https://www.saucedemo.com/

# Navegadores aceitos: chrome, firefox ou edge
browser=chrome

# false: mostra o navegador; true: executa sem interface gráfica
headless=false

# Tempo máximo das esperas explícitas
# E um limite de espera por condicao, nao uma pausa fixa em cada acao.
timeout.seconds=10

# Tamanho da janela
window.width=1440
window.height=900

# Credenciais públicas fornecidas pela própria aplicação de demonstração
standard.username=standard_user
standard.password=secret_sauce
